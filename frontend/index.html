<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KubeGuardian AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>KubeGuardian AI</h1>
    <p>Autonomous Kubernetes Threat Detection Platform</p>
</header>

<div class="container">

    <div class="stats">

        <div class="stat-card">
            <h3>Total Predictions</h3>
            <h1 id="totalThreats">0</h1>
        </div>

        <div class="stat-card">
            <h3>Critical Threats</h3>
            <h1 id="criticalThreats">0</h1>
        </div>

        <div class="stat-card">
            <h3>Low Threats</h3>
            <h1 id="lowThreats">0</h1>
        </div>

    </div>

    <div class="card">

        <h2>Threat Prediction</h2>

        <input
            type="text"
            id="process"
            placeholder="Process Name"
        >

        <input
            type="number"
            id="cpu"
            placeholder="CPU Usage"
        >

        <input
            type="number"
            id="memory"
            placeholder="Memory Usage"
        >

        <button onclick="predictThreat()">
            Predict Threat
        </button>

    </div>

    <div class="card">

        <h2>Prediction Result</h2>

        <div id="result">
            Waiting for prediction...
        </div>

    </div>

    <div class="card">

    <h2>Live Kubernetes Pods</h2>

    <table>

        <thead>
            <tr>
                <th>Pod</th>
                <th>Namespace</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody id="podsTable">

        </tbody>

    </table>

</div>

    <div class="card">

        <h2>Threat History</h2>

        <table id="historyTable">

            <thead>

                <tr>
                    <th>Timestamp</th>
                    <th>Process</th>
                    <th>Prediction</th>
                    <th>Severity</th>
                </tr>

            </thead>

            <tbody>

            </tbody>

        </table>

    </div>

</div>

<script src="app.js"></script>

</body>

</html>
