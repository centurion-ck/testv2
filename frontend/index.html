<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KubeGuardian AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>KubeGuardian AI</h1>
        <p>Autonomous Kubernetes Threat Detection Platform</p>
    </header>

    <div class="container">

        <div class="card">

            <h2>Threat Prediction</h2>

            <input
                type="text"
                id="process"
                placeholder="Process Name"
            >

            <input
                type="number"
                id="cpu"
                placeholder="CPU Usage"
            >

            <input
                type="number"
                id="memory"
                placeholder="Memory Usage"
            >

            <button onclick="predictThreat()">
                Predict Threat
            </button>

        </div>

        <div class="card">

            <h2>Prediction Result</h2>

            <div id="result">
                Waiting for prediction...
            </div>

        </div>

    </div>

    <div class="stats">

    <div class="stat-card">
        <h3>Total Threats</h3>
        <h1>15</h1>
    </div>

    <div class="stat-card">
        <h3>Malicious</h3>
        <h1>8</h1>
    </div>

    <div class="stat-card">
        <h3>Suspicious</h3>
        <h1>4</h1>
    </div>

    <div class="stat-card">
        <h3>Normal</h3>
        <h1>3</h1>
    </div>

</div>

<div class="card">

    <h2>Recent Threats</h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Process</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>1</td>
                <td>xmrig</td>
                <td>Malicious</td>
            </tr>

            <tr>
                <td>2</td>
                <td>bash</td>
                <td>Malicious</td>
            </tr>
        </tbody>
    </table>

</div>

<script src="app.js"></script>

</body>
</html>
